
openapi: 3.1.0
info:
  title: CampusPrint API
  version: 1.0.0
  description: >
    OpenAPI specification for the CampusPrint REST API.

servers:
  - url: http://localhost:5000/api/v1
    description: Development
  - url: https://api.campusprint.example/api/v1
    description: Production

tags:
  - name: Authentication
  - name: Orders
  - name: Files
  - name: Pricing
  - name: Payments
  - name: Notifications
  - name: Admin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password, studentId]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        studentId:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        status:
          type: string
          enum: [DRAFT, PAYMENT_PENDING, PAID, QUEUED, PRINTING, QUALITY_CHECK, READY, COLLECTED, CANCELLED, REFUNDED]
        total:
          type: number

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new student
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User registered
        "400":
          description: Validation error

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Authenticated
        "401":
          description: Invalid credentials

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      responses:
        "200":
          description: Orders returned
    post:
      tags: [Orders]
      summary: Create order
      responses:
        "201":
          description: Order created

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
        "404":
          description: Order not found

  /files/upload:
    post:
      tags: [Files]
      summary: Upload document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful

  /pricing/calculate:
    post:
      tags: [Pricing]
      summary: Calculate print price
      responses:
        "200":
          description: Price calculated

  /payments/create-order:
    post:
      tags: [Payments]
      summary: Create Razorpay order
      responses:
        "200":
          description: Razorpay order created

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment signature
      responses:
        "200":
          description: Payment verified

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications returned

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Dashboard metrics
      responses:
        "200":
          description: Dashboard data

  /admin/orders:
    get:
      tags: [Admin]
      summary: Manage orders
      responses:
        "200":
          description: Order list
