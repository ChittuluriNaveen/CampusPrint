name: CampusPrint CI Foundation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campusprint?schema=public"
      NODE_ENV: test
      JWT_SECRET: default_ci_jwt_secret_key_campusprint_12345

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: npm install
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: frontend

      - name: Lint Backend
        run: npm run lint
        working-directory: backend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend

      - name: Build Backend
        run: npm run build
        working-directory: backend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
